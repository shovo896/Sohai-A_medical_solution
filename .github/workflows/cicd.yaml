name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sohai-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: [self-hosted, Linux, X64]

    env:
      APP_DIR: /opt/sohai
      SERVICE_NAME: sohai
      PYTHON_VERSION: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.OPENAI_API_KEY }}" || (echo "OPENAI_API_KEY secret is missing" && exit 1)
          test -n "${{ secrets.PINECONE_API_KEY }}" || (echo "PINECONE_API_KEY secret is missing" && exit 1)

      - name: Install runner packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Install Python
        run: |
          uv python install "$PYTHON_VERSION"

      - name: Create CI venv
        run: |
          uv venv .ci-venv --python "$PYTHON_VERSION"

      - name: Install CI dependencies
        run: |
          uv pip install -r requirements.txt --python .ci-venv/bin/python

      - name: Run CI checks
        run: |
          .ci-venv/bin/python -m compileall app.py src store_index.py

      - name: Sync application files
        run: |
          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$USER:$USER" "$APP_DIR"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".env" \
            --exclude ".ci-venv" \
            --exclude ".venv" \
            --exclude "venv" \
            --exclude "__pycache__" \
            ./ "$APP_DIR/"

      - name: Configure production environment
        run: |
          cat > "$APP_DIR/.env" <<'EOF'
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_CLOUD=${{ vars.PINECONE_CLOUD || 'aws' }}
          PINECONE_REGION=${{ vars.PINECONE_REGION || 'us-east-1' }}
          EOF
          chmod 600 "$APP_DIR/.env"

      - name: Install production dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          uv venv .venv --python "$PYTHON_VERSION"
          uv pip install -r requirements.txt --python .venv/bin/python

      - name: Install or update systemd service
        run: |
          sudo tee "/etc/systemd/system/$SERVICE_NAME.service" >/dev/null <<EOF
          [Unit]
          Description=Sohai Flask application
          After=network.target

          [Service]
          Type=simple
          User=$USER
          WorkingDirectory=$APP_DIR
          EnvironmentFile=$APP_DIR/.env
          ExecStart=$APP_DIR/.venv/bin/gunicorn --workers 2 --bind 0.0.0.0:8000 app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable "$SERVICE_NAME"
          sudo systemctl restart "$SERVICE_NAME"

      - name: Verify service
        run: |
          sudo systemctl --no-pager --full status "$SERVICE_NAME"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8000/ >/dev/null
